global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'devsync-backend'
    static_configs:
      - targets: ['devsync-backend:5001']
    metrics_path: /metrics
    # Must match METRICS_TOKEN in .env - the backend rejects unauthenticated
    # scrapes of /metrics (see server.ts). Prometheus's own config format
    # doesn't support ${VAR} substitution from the environment, so this is
    # a literal value here, same as the checked-in .env.example default -
    # change both together if you rotate it for anything beyond local dev.
    authorization:
      credentials: devsync-local-metrics-token

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
