apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
  labels:
    app: devsync-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsync-backend
  template:
    metadata:
      labels:
        app: devsync-backend
    spec:
      containers:
        - name: devsync-backend
          image: devsync-backend:latest
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: devsync-secrets
          env:
            - name: VAULT_ADDR
              value: 'http://devsync-vault:8200'
            - name: PORT
              value: '5001'
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
